openapi: 3.1.0
info:
  title: RustDB Read-only HTTP Shell API
  version: 1.0.0-beta.2
  summary: Versioned background-query API used by the RustDB remote CLI.
  description: |
    RustDB v2 exposes one read-only SQL statement per background Query. Committed
    Arrow batches may be polled while execution runs; JSON/NDJSON pages become
    readable only after successful completion. If shutdown interrupts a Query,
    every batch committed before interruption remains available through the
    Arrow sequence API. Every `/v2`
    operation requires TLS and a principal Bearer Token; authentication runs
    before request-body or query-parameter parsing. Query-role principals can
    access only their own Query IDs, Admin principals can access every Query,
    and Idempotency Keys are scoped to the submitting principal. This specification deliberately
    excludes write SQL, Sessions, source administration, and uploads.
servers:
  - url: https://127.0.0.1:7400
    description: Default loopback listener
tags:
  - name: Health
  - name: Protocol
  - name: Queries
  - name: Operations
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: health
      summary: Report minimal process health
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/Problem"
  /readyz:
    get:
      tags: [Health]
      operationId: readiness
      summary: Report minimal request readiness
      security: []
      responses:
        "200":
          description: The server can accept requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
        "503":
          description: The server is starting or shutting down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotReady"
  /metrics:
    get:
      tags: [Operations]
      operationId: prometheusMetrics
      summary: Read low-cardinality service metrics
      description: |
        Requires an Admin principal. Query-role principals and the explicit
        no-auth development actor do not receive Admin permission.
      responses:
        "200":
          description: Prometheus text exposition without principal or Query-ID labels.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The authenticated principal is not an Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v2/info:
    get:
      tags: [Protocol]
      operationId: serverInfo
      summary: Negotiate protocol and server capabilities
      responses:
        "200":
          description: Authenticated server information.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v2/queries:
    get:
      tags: [Queries]
      operationId: listQueries
      summary: List visible Queries in stable newest-first order
      description: |
        Query principals see only their own Queries; Admin principals see every
        Query. The cursor is opaque and follows the immutable creation order.
      parameters:
        - name: state
          in: query
          description: Return only Queries in this state.
          schema:
            $ref: "#/components/schemas/QueryState"
        - name: created_after_ms
          in: query
          description: Return only Queries created strictly after this Unix epoch millisecond.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: cursor
          in: query
          description: Opaque cursor returned by the preceding list page.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: limit
          in: query
          description: Maximum Queries returned in this page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of visible Query status records.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryList"
        "400":
          description: A filter, limit, or cursor is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Queries]
      operationId: submitQuery
      summary: Submit one read-only SQL statement
      description: |
        A valid envelope creates a background Query. Repeating the same decoded
        request envelope with the same Idempotency-Key returns the original
        Query. JSON whitespace and object-member order are not part of the
        comparison. Reusing the key with a different envelope returns 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "202":
          description: Query accepted or an existing idempotent Query returned.
          headers:
            Location:
              description: Relative status resource for this Query.
              schema:
                type: string
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryAccepted"
        "400":
          description: Malformed JSON, invalid SQL, or an invalid request value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The Idempotency-Key was already used with another body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: Request exceeds the 1 MiB request-body limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: The request Content-Type is not application/json.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The JSON shape is invalid or the SQL is outside the read-only allowlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: |
            The engine or principal admission queue is full
            (`admission.queue_full`), or the Query reservation exceeds a
            configured admission layer (`admission.resource_limit`). Queue-full
            responses are safely retryable and include Retry-After.
          headers:
            Retry-After:
              description: Suggested delay in seconds.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v2/queries/{query_id}:
    parameters:
      - $ref: "#/components/parameters/QueryId"
    get:
      tags: [Queries]
      operationId: getQuery
      summary: Read Query status and bounded metrics
      responses:
        "200":
          description: Current Query state.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/QueryNotFound"
    delete:
      tags: [Queries]
      operationId: deleteQuery
      summary: Delete a terminal Query and its retained result
      description: This operation is idempotent after a Query is terminal.
      responses:
        "204":
          description: The terminal Query was deleted or was already absent.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The Query is queued or running; cancel it first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v2/queries/{query_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/QueryId"
    post:
      tags: [Queries]
      operationId: cancelQuery
      summary: Idempotently request Query cancellation
      responses:
        "202":
          description: Cancellation was signalled, or the Query was terminal.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/QueryNotFound"
  /v2/queries/{query_id}/results:
    parameters:
      - $ref: "#/components/parameters/QueryId"
      - name: cursor
        in: query
        description: |
          Opaque repeatable page cursor. Mutually exclusive with `offset`.
        schema:
          type: string
          minLength: 1
          maxLength: 2048
      - name: offset
        in: query
        description: Zero-based immutable result row offset. Defaults to zero.
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
      - name: limit
        in: query
        description: Requested rows; the 16 MiB encoded-row-payload cap may return fewer.
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1000
      - name: batch_seq
        in: query
        description: |
          Zero-based committed-batch sequence for incremental Arrow IPC polling.
          Required with `Accept: application/vnd.apache.arrow.file` and mutually
          exclusive with `cursor`, `offset`, and `limit`.
        schema:
          type: integer
          format: int64
          minimum: 0
    get:
      tags: [Queries]
      operationId: getQueryResults
      summary: Fetch a result page or poll one committed Arrow IPC batch
      description: |
        JSON and NDJSON pages are available only after `state` is `succeeded`.
        Send `Accept: application/json` or `Accept: application/x-ndjson` with
        row pagination. For incremental, backpressured delivery while a Query
        is still running, send `Accept: application/vnd.apache.arrow.file` and
        only `batch_seq`. Each Arrow 200 response is one independent Arrow IPC
        file containing exactly one RecordBatch. A completed zero-row result,
        a poll after the final batch, or a retained interrupted result with no
        further committed batches returns a schema-only Arrow IPC file. A
        retained interrupted result reports `X-RustDB-Result-State: interrupted`
        and ends at its last committed batch; it is a readable prefix, not a
        successful full result. Check status `result_available` before reading.
        Reads are immutable and repeatable; clients advance only to the exact
        `X-RustDB-Next-Batch-Seq` returned by the server.
      responses:
        "200":
          description: |
            For JSON/NDJSON, one result page with at most 10,000 rows and 16 MiB
            of encoded row arrays. For Arrow, one independent IPC file with one
            committed RecordBatch, or a schema-only completion file. The
            RustDB batch headers below are present only on Arrow responses.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            X-RustDB-Batch-Seq:
              $ref: "#/components/headers/BatchSeq"
            X-RustDB-Next-Batch-Seq:
              $ref: "#/components/headers/NextBatchSeq"
            X-RustDB-Batch-Rows:
              $ref: "#/components/headers/BatchRows"
            X-RustDB-Result-State:
              $ref: "#/components/headers/ResultState"
            X-RustDB-Result-Complete:
              $ref: "#/components/headers/ResultComplete"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultPage"
            application/x-ndjson:
              schema:
                type: string
                description: |
                  UTF-8 NDJSON: `{"type":"schema","columns":[...]}`, zero
                  or more `{"type":"row","values":[...]}` records, then
                  exactly one `{"type":"page","page":{...}}` record.
            application/vnd.apache.arrow.file:
              schema:
                type: string
                format: binary
                description: |
                  One Arrow IPC file containing one committed RecordBatch, or a
                  schema-only file when the requested sequence is complete.
        "204":
          description: |
            No Arrow batch is committed at `batch_seq` yet. The response has no
            body. Poll again after `Retry-After`; do not infer completion from
            an empty body.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            X-RustDB-Batch-Seq:
              $ref: "#/components/headers/BatchSeq"
            X-RustDB-Next-Batch-Seq:
              $ref: "#/components/headers/NextBatchSeq"
            X-RustDB-Result-State:
              $ref: "#/components/headers/ResultState"
            X-RustDB-Result-Complete:
              $ref: "#/components/headers/ResultComplete"
            Retry-After:
              description: Minimum polling delay in seconds.
              schema:
                type: integer
                const: 1
        "400":
          description: Pagination modes were mixed, a sequence was omitted, or a position is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/QueryNotFound"
        "409":
          description: The selected result mode cannot produce output for the Query state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "507":
          description: One encoded row exceeds the result-page resource limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The result reader is shutting down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Opaque principal credential read from an imported Profile Token file.
        The server stores only its SHA-256 digest. Query and Admin roles are
        authorized independently after authentication.
  headers:
    RequestId:
      description: Server-generated identifier for logs and support.
      schema:
        type: string
        minLength: 16
    BatchSeq:
      description: Sequence encoded by this Arrow response.
      schema:
        type: integer
        format: int64
        minimum: 0
    NextBatchSeq:
      description: Exact sequence to request on the next Arrow poll.
      schema:
        type: integer
        format: int64
        minimum: 0
    BatchRows:
      description: Rows in the returned Arrow RecordBatch; present on Arrow 200 only.
      schema:
        type: integer
        format: int64
        minimum: 0
    ResultState:
      description: Query/result state observed while serving the Arrow response.
      schema:
        type: string
        enum: [queued, running, succeeded, failed, cancelled, interrupted, invalidated]
    ResultComplete:
      description: True only when no batch follows `X-RustDB-Next-Batch-Seq`.
      schema:
        type: string
        enum: ["true", "false"]
  parameters:
    QueryId:
      name: query_id
      in: path
      required: true
      description: Unguessable Query identifier returned by submission.
      schema:
        type: string
        minLength: 32
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Caller-generated 16-128 character visible ASCII key (no spaces or
        control characters). Its lifetime is the lifetime of the resulting
        ephemeral Query.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[!-~]{16,128}$"
  responses:
    Problem:
      description: Structured server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid Bearer Token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: 'Bearer realm="rustdb"'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    QueryNotFound:
      description: Query ID is unknown, expired, deleted, or owned by another principal.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Ready:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ready
    NotReady:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: not_ready
    ServerInfo:
      type: object
      additionalProperties: false
      required:
        - protocol_version
        - server_version
        - read_only
        - capabilities
      properties:
        protocol_version:
          type: string
          const: v2
        server_version:
          type: string
          examples: [1.0.0-beta.2]
        read_only:
          type: boolean
          const: true
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - background_queries
              - arrow_ipc_results
              - batch_sequence_resume
              - typed_parameters
              - cursor_pagination
              - offset_pagination
              - json_results
              - ndjson_results
              - query_listing
              - structured_remote_errors
    QueryRequest:
      type: object
      additionalProperties: false
      required: [sql]
      properties:
        sql:
          type: string
          minLength: 1
          maxLength: 1048576
          description: Exactly one allowed read-only SQL statement.
        parameters:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/TypedParameter"
        timeout_ms:
          type: integer
          format: int64
          minimum: 1
          description: Optional timeout shorter than or equal to the server limit.
    TypedParameter:
      type: object
      additionalProperties: false
      required: [type, value]
      description: |
        A typed positional parameter. Use JSON null as the value of any listed
        type to create a typed NULL. Decimal128 requires `precision` and
        `scale`; Binary is Base64, Date32 is epoch days, and
        TimestampMicrosecond is microseconds since the Unix epoch. Integer and
        Decimal values are JSON numbers; Decimal also accepts an exact decimal
        string. Clients must preserve the original numeric token for exactness.
      properties:
        type:
          type: string
          enum:
            - boolean
            - int64
            - uint64
            - float64
            - decimal128
            - utf8
            - binary
            - date32
            - timestamp_microsecond
        value:
          description: "Value matching `type`, or JSON null for a typed NULL."
        precision:
          type: integer
          minimum: 1
          maximum: 38
        scale:
          type: integer
          minimum: 0
          maximum: 38
    QueryAccepted:
      type: object
      additionalProperties: false
      required: [query_id, state, replayed, status_url, results_url]
      properties:
        query_id:
          type: string
        state:
          $ref: "#/components/schemas/QueryState"
        replayed:
          type: boolean
        status_url:
          type: string
        results_url:
          type: string
    QueryState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, interrupted]
    QueryStatus:
      type: object
      additionalProperties: false
      required:
        - query_id
        - state
        - created_at_ms
        - result_available
      properties:
        query_id:
          type: string
        state:
          $ref: "#/components/schemas/QueryState"
        created_at_ms:
          type: integer
          format: int64
          minimum: 0
          description: Milliseconds since the Unix epoch.
        started_at_ms:
          type: integer
          format: int64
          minimum: 0
          description: Omitted until execution starts.
        finished_at_ms:
          type: integer
          format: int64
          minimum: 0
          description: Omitted until the Query is terminal.
        metrics:
          $ref: "#/components/schemas/QueryMetrics"
          description: Present after successful execution; otherwise omitted.
        error:
          $ref: "#/components/schemas/Problem"
          description: Present for failed, cancelled, or interrupted Queries; otherwise omitted.
        result_available:
          type: boolean
          description: True when a retained result can be read in at least one supported mode.
        result_expires_at_ms:
          type: integer
          format: int64
          minimum: 0
          description: Result retention deadline in Unix epoch milliseconds; omitted when unavailable.
        result_rows:
          type: integer
          format: int64
          minimum: 0
          description: Rows committed to retained storage; may be a prefix for an interrupted Query.
        result_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Bytes occupied by committed retained result batches.
        result_batches:
          type: integer
          format: int64
          minimum: 0
          description: Number of committed Arrow RecordBatches.
    QueryList:
      type: object
      additionalProperties: false
      required: [queries]
      properties:
        queries:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/QueryStatus"
        next_cursor:
          type: string
          maxLength: 256
          description: Omitted when there is no following page.
    QueryMetrics:
      type: object
      additionalProperties: false
      required:
        - elapsed_ms
        - rows_scanned
        - rows_returned
        - bytes_scanned
        - peak_memory_bytes
        - spill_read_bytes
        - spill_write_bytes
      properties:
        elapsed_ms:
          type: integer
          format: int64
          minimum: 0
        rows_scanned:
          type: integer
          format: int64
          minimum: 0
        rows_returned:
          type: integer
          format: int64
          minimum: 0
        bytes_scanned:
          type: integer
          format: int64
          minimum: 0
        peak_memory_bytes:
          type: integer
          format: int64
          minimum: 0
        spill_read_bytes:
          type: integer
          format: int64
          minimum: 0
        spill_write_bytes:
          type: integer
          format: int64
          minimum: 0
    ResultColumn:
      type: object
      additionalProperties: false
      required: [name, data_type, nullable]
      properties:
        name:
          type: string
        data_type:
          type: string
          description: Canonical Arrow logical type text.
        nullable:
          type: boolean
    ResultRow:
      type: array
      description: Ordered values interpreted using the page's `schema` array.
      items: {}
    PageMetadata:
      type: object
      additionalProperties: false
      required: [offset, row_count, complete]
      properties:
        offset:
          type: integer
          format: int64
          minimum: 0
        row_count:
          type: integer
          minimum: 0
          maximum: 10000
        complete:
          type: boolean
        next_cursor:
          type: string
          description: Omitted on the final page.
    ResultPage:
      type: object
      additionalProperties: false
      required: [schema, rows, page]
      properties:
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ResultColumn"
        rows:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/ResultRow"
        page:
          $ref: "#/components/schemas/PageMetadata"
    Problem:
      type: object
      additionalProperties: false
      required: [error, message, retry]
      properties:
        error:
          type: string
          pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)*$"
          examples: [query.not_found]
        message:
          type: string
        retry:
          type: string
          enum: [never, safe, reopen_required, outcome_unknown, unknown]
          description: Machine-readable retry safety; clients must not infer this from `message`.
        request_id:
          type: string
        query_id:
          type: string
        details:
          type: object
          additionalProperties: true
