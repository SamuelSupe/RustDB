name: Security

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, "codex/release-*"]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-dependencies:
    name: Source and dependency gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: RustSec advisory audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: rustdb-source.spdx.json
          upload-release-assets: false
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rustdb-source-sbom
          path: rustdb-source.spdx.json
          if-no-files-found: error
          retention-days: 30

  container:
    name: Non-root OCI image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build OCI image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          pull: true
          push: false
          tags: rustdb:security-check
      - name: Verify the image runs without root
        run: |
          test "$(docker image inspect rustdb:security-check --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker run --rm --network none --entrypoint /usr/bin/id rustdb:security-check -u)" = "10001"
          docker run --rm --network none --entrypoint /bin/sh rustdb:security-check -c \
            'test -w /var/lib/rustdb && test ! -w /usr/local/bin/rustdb'
          docker run --rm --network none rustdb:security-check --version
      - name: Scan OCI image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: rustdb:security-check
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
