name: Distribution

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the validated packages to an existing GitHub Release
        required: false
        default: false
        type: boolean
      release_tag:
        description: Existing release tag to receive the runnable packages
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: dist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-contract:
    name: Validate release tag contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate annotated release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          version="${GITHUB_REF_NAME#v}"
          package_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$version" = "$package_version"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          acceptance_sha=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          test "$acceptance_sha" = "$GITHUB_SHA"
          tag_message=$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")
          grep -Fqx "RustDB-Acceptance-SHA: $acceptance_sha" <<<"$tag_message"
          grep -Fqx "RustDB-Acceptance-Status: passed" <<<"$tag_message"
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
      - name: Confirm manual packaging mode
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release != true
        run: echo "Manual dispatch builds and validates packages without publishing a release."
      - name: Confirm manual publish mode
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        run: echo "Manual dispatch will publish validated packages to the requested release."

  release-security:
    name: Release security gates
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: tag-contract
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/security.yml

  package:
    name: Package (${{ matrix.target }})
    needs: [tag-contract, release-security]
    if: >-
      always() &&
      needs.tag-contract.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.release-security.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-aarch64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: scripts/ci/install-rust.sh
      - name: Cache Cargo sources
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: dist-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            dist-${{ runner.os }}-${{ runner.arch }}-
      - name: Build release CLI
        run: cargo build --locked --release --bin rustdb
      - name: Package and validate
        run: >-
          scripts/dist/package.sh
          --binary target/release/rustdb
          --output dist
          --target ${{ matrix.target }}
          --check
      - name: Upload distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rustdb-package-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  oci-platform:
    name: OCI (${{ matrix.arch }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [tag-contract, release-security, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
      - name: Authenticate to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push non-root platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          pull: true
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

  oci-manifest:
    name: Publish and sign OCI manifest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [tag-contract, release-security, oci-platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
      - name: Authenticate to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-platform manifest
        shell: bash
        run: |
          image=${{ steps.image.outputs.name }}
          docker buildx imagetools create \
            --tag "$image:${GITHUB_REF_NAME}" \
            "$image:${GITHUB_REF_NAME}-amd64" \
            "$image:${GITHUB_REF_NAME}-arm64"
      - name: Sign OCI manifest by digest
        shell: bash
        run: |
          image=${{ steps.image.outputs.name }}
          digest=$(docker buildx imagetools inspect "$image:${GITHUB_REF_NAME}" | awk '/^Digest:/ {print $2; exit}')
          test -n "$digest"
          cosign sign --yes "$image@$digest"

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [tag-contract, release-security, package, oci-manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download all platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rustdb-package-*
          path: release-assets
          merge-multiple: true
      - name: Validate tag, packages, and release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$version" = "$package_version"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          acceptance_sha=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          test "$acceptance_sha" = "$GITHUB_SHA"
          tag_message=$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")
          grep -Fqx "RustDB-Acceptance-SHA: $acceptance_sha" <<<"$tag_message"
          grep -Fqx "RustDB-Acceptance-Status: passed" <<<"$tag_message"
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
          test "$(find release-assets -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" -eq 3
          test "$(find release-assets -maxdepth 1 -name '*.tar.gz.sha256' -type f | wc -l)" -eq 3
          for archive in release-assets/*.tar.gz; do
            RUSTDB_DIST_SKIP_EXEC=1 scripts/dist/check.sh "$archive"
          done
          install -m 0644 docs/openapi-v2.yaml release-assets/rustdb-openapi-v2.yaml
          (
            cd release-assets
            sha256sum rustdb-openapi-v2.yaml >rustdb-openapi-v2.yaml.sha256
          )
      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: release-assets/rustdb-source.spdx.json
      - name: Checksum release SBOM
        shell: bash
        run: |
          cd release-assets
          sha256sum rustdb-source.spdx.json >rustdb-source.spdx.json.sha256
      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
      - name: Sign release assets with keyless Sigstore bundles
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            release-assets/*.tar.gz \
            release-assets/*.tar.gz.sha256 \
            release-assets/*.yaml \
            release-assets/*.yaml.sha256 \
            release-assets/*.spdx.json \
            release-assets/*.spdx.json.sha256; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
          done
      - name: Attest packaged binaries
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: release-assets/*.tar.gz
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --verify-tag \
            --prerelease \
            --title "RustDB $GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"

  manual-release:
    name: Publish manual runnable packages
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_release == true &&
      needs.tag-contract.result == 'success' &&
      needs.package.result == 'success'
    needs: [tag-contract, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download all platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rustdb-package-*
          path: release-assets
          merge-multiple: true
      - name: Validate release target and packages
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          version="${RELEASE_TAG#v}"
          package_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$RELEASE_TAG" != "$version"
          test "$version" = "$package_version"
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(find release-assets -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" -eq 3
          test "$(find release-assets -maxdepth 1 -name '*.tar.gz.sha256' -type f | wc -l)" -eq 3
          for archive in release-assets/*.tar.gz; do
            RUSTDB_DIST_SKIP_EXEC=1 scripts/dist/check.sh "$archive"
          done
      - name: Upload runnable packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" \
            release-assets/*.tar.gz \
            release-assets/*.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
