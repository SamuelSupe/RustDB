name: TPC-H acceptance

on:
  workflow_dispatch:
    inputs:
      scale:
        description: TPC-H scale factor (SF1 is the release gate)
        required: true
        default: "0.01"
        type: choice
        options:
          - "0.01"
          - "1"
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: tpch-${{ github.event_name == 'schedule' && '1' || inputs.scale }}
  cancel-in-progress: false

jobs:
  checksum:
    name: Q1-Q22 local and MinIO checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      TPCH_SCALE: ${{ github.event_name == 'schedule' && '1' || inputs.scale || '0.01' }}
    steps:
      - uses: actions/checkout@v6
      - name: Restore generated Parquet dataset
        uses: actions/cache@v5
        with:
          path: data/tpch-sf${{ env.TPCH_SCALE }}
          key: tpch-parquet-duckdb-1.4.3-sf${{ env.TPCH_SCALE }}-${{ hashFiles('tools/tpch/**', 'benchmarks/tpch/**') }}
      - name: Generate and validate Parquet dataset
        run: tools/tpch/generate.sh "$TPCH_SCALE"
      - name: Compare Q1-Q22 on local files
        run: |
          tools/tpch/compare.sh --report \
            --queries benchmarks/tpch/cases/sf1-local.txt "$TPCH_SCALE"
          dataset="data/tpch-sf${TPCH_SCALE}/results"
          rm -rf "$dataset/local"
          mv "$dataset/latest" "$dataset/local"
      - name: Upload the matching dataset to MinIO
        id: minio
        run: |
          uri=$(tools/tpch/upload_minio.sh "$TPCH_SCALE" | tail -n 1)
          case "$uri" in
            s3://*/*) ;;
            *) echo "upload did not return a non-empty s3:// bucket/prefix URI" >&2; exit 2 ;;
          esac
          echo "uri=$uri" >> "$GITHUB_OUTPUT"
      - name: Compare Q1-Q22 through S3-compatible I/O
        env:
          TPCH_MINIO_URI: ${{ steps.minio.outputs.uri }}
        run: |
          case "$TPCH_MINIO_URI" in
            s3://*/*) ;;
            *) echo "MinIO URI is missing or invalid" >&2; exit 2 ;;
          esac
          tools/tpch/compare.sh --report \
            --queries benchmarks/tpch/cases/sf1-minio.txt \
            --rustdb-root "$TPCH_MINIO_URI" "$TPCH_SCALE"
          dataset="data/tpch-sf${TPCH_SCALE}/results"
          rm -rf "$dataset/minio"
          mv "$dataset/latest" "$dataset/minio"
