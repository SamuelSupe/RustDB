[package]
name = "rustdb"
version = "1.0.0-beta.1"
edition = "2024"
description = "A single-node embedded OLAP engine for external and native columnar data"
license = "Apache-2.0"
repository = "https://github.com/SamuelSupe/RustDB"
homepage = "https://github.com/SamuelSupe/RustDB"
readme = "README.md"
keywords = ["olap", "parquet", "csv", "arrow", "query-engine"]
categories = ["database-implementations", "command-line-utilities"]

[lib]
name = "rustdb"
path = "src/lib.rs"

[[bin]]
name = "rustdb"
path = "src/bin/rustdb.rs"

[[bin]]
name = "rustdb-bench"
path = "src/bin/rustdb-bench.rs"

[dependencies]
ahash = "0.8"
arrow = { version = "=59.1.0", features = ["chrono-tz", "csv", "ipc", "ipc_compression", "prettyprint"] }
async-stream = "0.3"
async-compression = { version = "=0.4.42", default-features = false, features = ["tokio", "gzip", "zstd"] }
async-trait = "0.1"
axum = "=0.8.9"
axum-server = { version = "=0.8.0", features = ["tls-rustls"] }
base64 = "=0.22.1"
bytes = "1"
chrono = "=0.4.45"
chrono-tz = "=0.10.4"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
getrandom = "0.3"
glob = "0.3"
hashbrown = "0.16"
hyper-util = { version = "=0.1.20", features = ["server-auto", "tokio"] }
lru = "0.16"
memchr = "=2.8.3"
object_store = { version = "=0.14.1", features = ["aws"] }
parquet = { version = "=59.1.0", features = ["async"] }
parking_lot = "0.12"
rcgen = { version = "=0.14.8", features = ["pem", "x509-parser"] }
regex = "=1.13.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["gzip", "http2", "json", "rustls"] }
rustix = { version = "=1.1.4", features = ["fs"] }
rustls = { version = "=0.23.41", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
sqlparser = { version = "=0.62.0", features = ["visitor"] }
sysinfo = "0.37"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml = "0.9"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "=0.6.8", features = ["compression-gzip", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1"
rand = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
