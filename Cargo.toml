[package]
name = "rustdb"
version = "0.1.0"
edition = "2024"
description = "A single-node, read-only OLAP engine for local and object-store files"
license = "Apache-2.0"

[lib]
name = "rustdb"
path = "src/lib.rs"

[[bin]]
name = "rustdb"
path = "src/bin/rustdb.rs"

[[bin]]
name = "rustdb-bench"
path = "src/bin/rustdb-bench.rs"

[dependencies]
ahash = "0.8"
arrow = { version = "=59.1.0", features = ["csv", "ipc", "ipc_compression", "prettyprint"] }
async-stream = "0.3"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
glob = "0.3"
hashbrown = "0.16"
lru = "0.16"
object_store = { version = "=0.13.2", features = ["aws"] }
parquet = { version = "=59.1.0", features = ["async", "object_store"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = { version = "=0.62.0", features = ["visitor"] }
sysinfo = "0.37"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1"
rand = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
